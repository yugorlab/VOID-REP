<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>VOID — Notes & Reports</title>
<style>
:root{--bg:#000;--pane:#0b0b0d;--field:#101013;--border:#26212b;--text:#f1eff4;--muted:#9c94a3;--accent:#b38aff;--accentDark:#241831;--danger:#f2a6af;--radius:2px}
*{box-sizing:border-box}
html{background:var(--bg)}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
#app{width:min(100%,940px);margin:0 auto;min-height:100dvh;
 padding-top:calc(8px + max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px)));
 padding-right:calc(clamp(16px,4vw,32px) + max(env(safe-area-inset-right, 0px), var(--safe-area-inset-right, 0px)));
 padding-bottom:calc(30px + max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px)));
 padding-left:calc(clamp(16px,4vw,32px) + max(env(safe-area-inset-left, 0px), var(--safe-area-inset-left, 0px)))}
.top{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--border)}
.brand{font-weight:800;letter-spacing:.15em;font-size:23px}.brand span{color:var(--accent)}.subbrand{display:block;color:var(--muted);font-size:11px;letter-spacing:.07em;font-weight:400}
.status{font-size:12px;color:var(--muted);text-align:right}.status b{color:var(--accent);font-weight:500}
.tabs{display:flex;border-bottom:1px solid var(--border);gap:26px;margin-bottom:28px}
.tab{border:0;border-bottom:2px solid transparent;background:none;padding:15px 1px;color:var(--muted);font-weight:600;font-size:13px;letter-spacing:.03em}.tab[aria-current="page"]{color:var(--text);border-color:var(--accent)}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 18px}.pagehead h1{font-size:25px;line-height:1.25;margin:0;font-weight:650;letter-spacing:-.025em}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--accent);margin:0 0 5px}
.hint{color:var(--muted);font-size:13px}.muted{color:var(--muted)}
.btn{min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:#101013;border-radius:2px;padding:8px 14px;font-size:13px;font-weight:550;white-space:nowrap}
.btn:hover{border-color:#58416f}.btn-icon{width:40px;height:40px;min-width:40px;padding:0;font-size:24px;font-weight:400;line-height:1}.btn-icon.btn-small{width:34px;height:34px;min-width:34px;font-size:21px}.btn-text.btn-add{font-size:23px;line-height:1;min-width:35px;min-height:34px;text-align:center;display:inline-flex;justify-content:center;align-items:center}.btn-text.btn-add:hover{background:#17101f}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.btn-primary{background:var(--accentDark);border-color:#5e4381;color:#e7d7ff}.btn-plain{border-color:transparent;background:transparent;color:var(--accent)}.btn-danger{color:var(--danger)}.btn-small{font-size:12px;min-height:33px;padding:5px 10px}.btn-text{border:0;color:var(--accent);padding:4px 0;background:transparent;font-size:13px;text-align:left}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin:15px 0}
.row{display:flex;align-items:center;gap:12px}.spread{justify-content:space-between}.grow{flex:1;min-width:0}
input,textarea,select{width:100%;border:1px solid var(--border);background:var(--field);border-radius:2px;padding:12px 13px;outline:none;accent-color:var(--accent)}
input::placeholder,textarea::placeholder{color:#736a7b}textarea{resize:vertical;min-height:90px;line-height:1.6}input[type="month"]{color-scheme:dark;max-width:190px}select{width:auto;max-width:100%}
input:focus,textarea:focus,select:focus{border-color:#8763b5}label{display:block;color:var(--muted);font-size:12px;font-weight:550;margin:0 0 7px;letter-spacing:.01em}.field{margin-bottom:17px}.field:last-child{margin-bottom:0}
.search{margin:0 0 15px}.list{border:1px solid var(--border);border-radius:2px;overflow:hidden}.item{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;border:0;border-bottom:1px solid var(--border);background:#09090a;text-align:left;padding:18px 16px}.item:last-child{border-bottom:0}.item:hover{background:#121016}.item .name{font-weight:580;display:block;word-break:break-word}.item small{color:var(--muted);font-size:12px}.item .chevron{color:var(--accent);font-size:19px}
.blank{text-align:center;padding:50px 22px;border:1px dashed var(--border);border-radius:2px}.blank strong{display:block;margin-bottom:6px}.blank p{margin:0;color:var(--muted);font-size:13px}
.panel{background:var(--pane);border:1px solid var(--border);border-radius:2px;padding:16px;margin-bottom:16px}.panel h2{font-size:15px;font-weight:650;margin:0}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}
.back{margin:0 0 20px;font-size:13px}.back button{background:none;border:none;color:var(--accent);padding:0;font:inherit}
.titleinput{background:transparent;border:0;border-bottom:1px solid var(--border);border-radius:0;font-size:24px;font-weight:600;padding:4px 0 11px;width:100%;margin-bottom:12px}.titleinput:focus{outline:0;border-color:var(--accent)}
.note-editor{min-height:50dvh;background:transparent;border:0;border-radius:0;resize:vertical;padding:14px 0;font-size:15px;line-height:1.75}.note-editor:focus{outline:none;border:0}
.note-stats{border-top:1px solid var(--border);padding:12px 0;color:var(--muted);font-size:12px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.task{display:flex;gap:8px;align-items:flex-start;margin-bottom:9px}.task textarea{min-height:48px;max-height:180px;flex:1;resize:vertical}.task .btn{margin-top:4px}
.volunteer{border:1px solid var(--border);border-radius:2px;padding:14px;margin-bottom:12px;background:#080809}.volunteer .vol-head{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px}.volunteer .vol-head .grow{flex:1}
.secondaryline{padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:18px}.secondaryline:last-child{border:0}.report-header{display:flex;gap:12px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}.report-header .field{margin:0}
.pill{color:var(--accent);border:1px solid #4c365f;padding:3px 9px;border-radius:2px;font-size:11px;white-space:nowrap}
.preview{color:var(--text);word-break:break-word;line-height:1.7;font-size:14px;padding:2px 0;min-height:120px}.preview h1{font-size:24px;margin:17px 0 7px}.preview h2{font-size:19px;margin:20px 0 7px}.preview h3{font-size:16px;margin:16px 0 6px}.preview p{margin:9px 0}.preview ul,.preview ol{padding-left:22px;margin:10px 0}.preview blockquote{border-left:2px solid var(--accent);padding:3px 12px;color:var(--muted);margin:10px 0}.preview code{background:#262029;border-radius:2px;padding:2px 5px;font-size:12px}.preview pre{overflow:auto;background:#121014;border:1px solid var(--border);padding:12px;border-radius:2px}.preview pre code{background:none;padding:0}.preview hr{border:0;border-top:1px solid var(--border);margin:18px 0}
.prelike{white-space:pre-wrap;word-break:break-word;background:#0b0b0d;border:1px solid var(--border);padding:16px;border-radius:2px;overflow:auto;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;color:#d9d1e2}
.notices{position:fixed;bottom:calc(16px + max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px)));left:50%;transform:translateX(-50%);z-index:100;width:max-content;max-width:calc(100% - 30px);background:#221a2d;border:1px solid #634783;color:#f4ecfc;border-radius:2px;padding:10px 16px;box-shadow:0 6px 25px #0009;font-size:13px}
.footer{border-top:1px solid var(--border);margin-top:38px;padding-top:18px;color:#766d7c;font-size:11px}
.kbdbar{display:flex;gap:5px;flex-wrap:wrap}.kbdbar button{border:1px solid var(--border);background:#0d0d0f;color:#c7b4de;border-radius:2px;min-width:35px;padding:5px 8px;font-size:12px}
.report-create{display:flex;align-items:center;gap:8px;margin:0 0 18px}.report-create input{flex:1;max-width:220px}.blank{padding:32px 18px}.top{min-height:66px}.hidden{display:none!important}.divider{border:0;border-top:1px solid var(--border);margin:18px 0}
@media(max-width:570px){#app{padding-left:calc(17px + max(env(safe-area-inset-left, 0px), var(--safe-area-inset-left, 0px)));padding-right:calc(17px + max(env(safe-area-inset-right, 0px), var(--safe-area-inset-right, 0px)))}.top{min-height:62px}.tabs{gap:22px;margin-bottom:22px}.pagehead h1{font-size:23px}.pagehead{align-items:flex-end}.pagehead .btn{padding:8px 10px}.panel{padding:13px}.status{font-size:11px}.volunteer .vol-head{align-items:stretch;flex-wrap:wrap}.volunteer .vol-head .grow{flex-basis:100%}.note-editor{min-height:55dvh}}
</style>
</head>
<body>
<div id="app">
<header class="top"><div class="brand">VOID<span>.</span></div></header>
<nav class="tabs" aria-label="Main navigation"><button class="tab" data-tab="notes">Notes</button><button class="tab" data-tab="reports">Reports</button><button class="tab" data-tab="settings">Settings</button></nav>
<main id="main"></main>

</div>
<div id="notice" class="notices hidden" role="status" aria-live="polite"></div>
<script>
(() => {
'use strict';
const STORE='void_workspace_v1';
const $=s=>document.querySelector(s);
const now=()=>new Date().toISOString();
const uid=()=> (globalThis.crypto?.randomUUID?.() || 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2));
const thisMonth=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
const newData=()=>({version:1,settings:{name:'Sorta'},notes:[],reports:[]});
let data;
try {data=JSON.parse(localStorage.getItem(STORE))||newData();if(!Array.isArray(data.notes)||!Array.isArray(data.reports))throw Error('Invalid data');data.settings ||= {name:'Sorta'};} catch{data=newData()}
let view={tab:'notes',noteId:null,reportId:null,preview:false,reportPreview:false,query:''};
let noticeTimer;
const html=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=html;
const fmtMonth=s=>{if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(s||''))return s||'Unspecified';const [y,m]=s.split('-').map(Number);return new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,1)))};
const fmtDate=s=>{try{return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric'}).format(new Date(s))}catch{return ''}};
const countWords=s=>String(s||'').trim().split(/\s+/).filter(Boolean).length;
const main=$('#main');
function notify(message){const box=$('#notice');box.textContent=message;box.classList.remove('hidden');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>box.classList.add('hidden'),2600)}
function save(){try{localStorage.setItem(STORE,JSON.stringify(data));const state=$('#save-state');if(state)state.textContent='Saved on device';return true}catch(e){const state=$('#save-state');if(state)state.textContent='Save failed — export backup';notify('Local save failed. Export a backup before closing.');return false}}
function touch(x){x.updated=now();save()}
function activeNote(){return data.notes.find(n=>n.id===view.noteId)}
function activeReport(){return data.reports.find(r=>r.id===view.reportId)}
function setTab(tab){view.tab=tab;view.noteId=null;view.reportId=null;view.preview=false;view.reportPreview=false;render()}
function render(){document.querySelectorAll('[data-tab]').forEach(e=>e.setAttribute('aria-current',e.dataset.tab===view.tab?'page':'false'));if(view.tab==='notes')renderNotes();else if(view.tab==='reports')renderReports();else renderSettings()}
function renderNotes(){const note=activeNote();if(note){renderNoteEditor(note);return}
const matches=data.notes.filter(n=>(n.title+' '+n.body).toLowerCase().includes(view.query.toLowerCase())).sort((a,b)=>b.updated.localeCompare(a.updated));
main.innerHTML=`<div class="pagehead"><div><h1>Notes</h1></div><button class="btn btn-primary btn-icon" data-action="new-note" aria-label="New note" title="New note">+</button></div><input class="search" id="note-search" type="search" value="${attr(view.query)}" placeholder="Search notes..." aria-label="Search notes"><div id="note-list">${noteItems(matches)}</div>`;
}
function noteItems(items){return items.length?`<div class="list">${items.map(n=>`<button class="item" data-open-note="${attr(n.id)}"><span class="grow"><span class="name">${html(n.title||'Untitled')}</span><small>${html(fmtDate(n.updated))} · ${countWords(n.body)} words</small></span><span class="chevron">›</span></button>`).join('')}</div>`:`<div class="blank"><strong>${view.query?'No results':'No notes'}</strong></div>`}
function renderNoteEditor(n){main.innerHTML=`<div class="back"><button data-action="back-notes">← Notes</button></div><input id="note-title" class="titleinput" aria-label="Document title" placeholder="Untitled" value="${attr(n.title)}"><div class="toolbar"><div class="actions"><button class="btn btn-small ${!view.preview?'btn-primary':''}" data-action="note-edit">Edit</button><button class="btn btn-small ${view.preview?'btn-primary':''}" data-action="note-preview">Preview</button></div><div class="actions"><button class="btn btn-small" data-action="copy-note">Copy MD</button><button class="btn btn-small" data-action="export-note">↓ .md</button><button class="btn btn-small" data-action="export-note-docx">↓ .docx</button><button class="btn btn-small btn-danger" data-action="delete-note">Delete</button></div></div><div id="note-edit-area" ${view.preview?'class="hidden"':''}><div class="kbdbar"><button title="Bold" data-format="bold">**B**</button><button title="Italic" data-format="italic">*I*</button><button title="Heading" data-format="heading">H</button><button title="List item" data-format="list">—</button><button title="Quote" data-format="quote">❞</button></div><textarea id="note-body" class="note-editor" aria-label="Markdown editor" spellcheck="true" placeholder="Start typing...">${html(n.body)}</textarea></div><article id="note-preview-area" class="preview ${view.preview?'':'hidden'}">${renderMarkdown(n.body)}</article><div class="note-stats"><span id="word-count">${countWords(n.body)} words</span></div>`}
function renderReports(){const r=activeReport();if(r){renderReportEditor(r);return}
const items=[...data.reports].sort((a,b)=>(b.month||'').localeCompare(a.month||''));
main.innerHTML=`<div class="pagehead"><div><h1>Reports</h1></div></div><div class="report-create"><label class="sr-only" for="new-month">Report month</label><input type="month" id="new-month" value="${thisMonth()}"><button class="btn btn-primary btn-icon" data-action="new-report" aria-label="Create report" title="Create report">+</button></div>${items.length?`<div class="list">${items.map(x=>`<button class="item" data-open-report="${attr(x.id)}"><span class="grow"><span class="name">${html(fmtMonth(x.month))}</span><small>${html(x.seniorName||'Unnamed volunteer')} · ${x.volunteers.length} volunteer${x.volunteers.length===1?'':'s'}</small></span><span class="pill">${html(x.status||'Draft')}</span></button>`).join('')}</div>`:`<div class="blank"><strong>No reports</strong></div>`}`;
}
function taskInputs(tasks,scope,vid){return tasks.map((t,i)=>`<div class="task"><textarea rows="1" aria-label="Completed task ${i+1}" placeholder="Describe completed work..." data-scope="${scope}" ${vid?`data-vol="${attr(vid)}"`:''} data-index="${i}">${html(t)}</textarea><button class="btn btn-small btn-danger" aria-label="Remove task" data-action="remove-task" data-scope="${scope}" ${vid?`data-vol="${attr(vid)}"`:''} data-index="${i}">×</button></div>`).join('')}
function renderReportEditor(r){
main.innerHTML=`<div class="back"><button data-action="back-reports">← Reports</button></div><div class="pagehead"><div><h1>${html(fmtMonth(r.month))}</h1></div></div><div class="toolbar"><div class="actions"><button class="btn btn-small ${!view.reportPreview?'btn-primary':''}" data-action="report-edit">Form</button><button class="btn btn-small ${view.reportPreview?'btn-primary':''}" data-action="report-preview">Preview</button></div><div class="actions"><button class="btn btn-small" data-action="copy-report">Copy MD</button><button class="btn btn-small" data-action="export-report">↓ .md</button><button class="btn btn-small" data-action="export-report-docx">↓ .docx</button></div></div>
<div id="report-form" class="${view.reportPreview?'hidden':''}"><div class="report-header"><div class="field"><label for="report-month">Report period</label><input id="report-month" type="month" value="${attr(r.month)}"></div><div class="field"><label for="report-status">Status</label><select id="report-status">${['Draft','Ready','Submitted'].map(s=>`<option value="${s}" ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div>
<section class="panel"><div class="panelhead"><h2>Senior volunteer</h2></div><div class="field"><label for="senior-name">Name</label><input id="senior-name" value="${attr(r.seniorName)}" placeholder="Senior volunteer name"></div><label>Completed work</label><div id="senior-tasks">${taskInputs(r.seniorTasks,'senior')}</div><button class="btn-text btn-add" data-action="add-task" data-scope="senior" aria-label="Add senior volunteer task" title="Add task">+</button></section>
<section class="panel"><div class="panelhead"><h2>Segment volunteers</h2><span class="pill">${r.volunteers.length}</span></div><div id="volunteer-list">${r.volunteers.map(v=>`<div class="volunteer" data-volunteer="${attr(v.id)}"><div class="vol-head"><div class="grow"><label>Volunteer name</label><input placeholder="Name" value="${attr(v.name)}" data-vol-name="${attr(v.id)}" list="saved-volunteers"></div><button class="btn btn-small btn-icon btn-danger" data-action="remove-volunteer" data-vol="${attr(v.id)}" aria-label="Remove volunteer" title="Remove volunteer">×</button></div><label>Completed work</label><div>${taskInputs(v.tasks,'volunteer',v.id)}</div><button class="btn-text btn-add" data-action="add-task" data-scope="volunteer" data-vol="${attr(v.id)}" aria-label="Add task for ${attr(v.name||'volunteer')}" title="Add task">+</button></div>`).join('')}</div><datalist id="saved-volunteers">${[...new Set(data.reports.flatMap(x=>x.volunteers.map(v=>v.name)).filter(Boolean))].map(name=>`<option value="${attr(name)}"></option>`).join('')}</datalist><button class="btn btn-small btn-icon btn-primary" data-action="add-volunteer" aria-label="Add volunteer" title="Add volunteer">+</button></section>
<section class="panel"><div class="panelhead"><h2>General notes</h2></div><textarea id="general-notes" rows="4" placeholder="Observations, coordination, issues...">${html(r.notes)}</textarea></section>
<section class="panel"><div class="panelhead"><h2>Suggestions</h2></div><textarea id="suggestions" rows="4" placeholder="Ideas, proposals, improvements...">${html(r.suggestions)}</textarea></section>
<div class="actions spread"><button class="btn btn-small btn-danger" data-action="delete-report">Delete report</button></div></div>
<div id="report-preview-area" class="${view.reportPreview?'':'hidden'}"><article id="report-md-preview" class="panel preview">${renderMarkdown(reportMarkdown(r))}</article><details><summary class="hint" style="cursor:pointer">View raw Markdown</summary><pre class="prelike">${html(reportMarkdown(r))}</pre></details></div>`;
}
function renderSettings(){main.innerHTML=`<div class="pagehead"><h1>Settings</h1></div><section class="panel"><div class="panelhead"><h2>Profile</h2></div><div class="field"><label for="profile-name">Senior volunteer</label><input id="profile-name" value="${attr(data.settings.name||'')}" placeholder="Your name"></div><p class="hint">Used in new reports.</p></section><section class="panel"><div class="panelhead"><h2>Storage</h2><span class="pill" id="save-state">Saved on device</span></div><p class="hint">Notes and reports save automatically on this device. Export a backup before clearing app data or uninstalling.</p><div class="actions"><button class="btn btn-primary" data-action="backup">↓ Export backup</button><button class="btn" data-action="restore">↑ Restore</button></div><input id="restore-input" class="hidden" type="file" accept=".json,application/json" aria-label="Choose JSON backup"></section><section class="panel"><div class="panelhead"><h2>Formats</h2></div><p class="hint">Notes and reports: Markdown (.md) or Word (.docx). Backups: JSON (.json).</p></section>`}
function newNote(){const n={id:uid(),title:'',body:'',created:now(),updated:now()};data.notes.push(n);save();view.noteId=n.id;view.preview=false;render();$('#note-title')?.focus()}
function createReport(){const month=$('#new-month')?.value;if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month||'')){notify('Choose a valid month');return}const existing=data.reports.find(r=>r.month===month);if(existing){view.reportId=existing.id;render();notify('Opened the existing report');return}
const old=[...data.reports].sort((a,b)=>b.month.localeCompare(a.month))[0];const r={id:uid(),month,status:'Draft',seniorName:data.settings.name||'Sorta',seniorTasks:[''],volunteers:old?old.volunteers.map(v=>({id:uid(),name:v.name,tasks:['']})):[],notes:'',suggestions:'',created:now(),updated:now()};data.reports.push(r);save();view.reportId=r.id;view.reportPreview=false;render()}
function safeFilename(name){return (name||'untitled').trim().normalize('NFKC').replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').replace(/\s+/g,' ').slice(0,100)||'untitled'}
function download(name,content,type='text/markdown;charset=utf-8'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);notify('File export started')}
async function copyText(value){try{if(!navigator.clipboard?.writeText)throw Error('Clipboard API unavailable');await navigator.clipboard.writeText(value);notify('Markdown copied')}catch{const t=document.createElement('textarea');t.value=value;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();try{if(!document.execCommand('copy'))throw Error('Copy failed');notify('Markdown copied')}catch{notify('Copy unavailable. Use export instead.')}finally{t.remove()}}}
function escapedName(s){return String(s||'Unnamed').replace(/([\\`*_{}\[\]()#+.!>|-])/g,'\\$1')}
// Native offline .docx (OOXML) export. No CDN or remote converter involved.
const OOXML='http://schemas.openxmlformats.org/wordprocessingml/2006/main';

function downloadDocx(filename,markdown,title){try{download(filename,createDocx(markdown,title),'application/vnd.openxmlformats-officedocument.wordprocessingml.document')}catch(err){console.error(err);notify('DOCX export failed')}}
function reportMarkdown(r){const clean=s=>String(s||'').trim();const sections=[];sections.push(`# Monthly Volunteer Report — ${fmtMonth(r.month)}`,'',`**Period:** ${fmtMonth(r.month)}`,'',`## Senior Volunteer — ${escapedName(r.seniorName)}`,'',`### Completed Work`,'');sections.push(...nonemptyTasks(r.seniorTasks));sections.push('','## Segment Volunteers','');if(r.volunteers.length){for(const v of r.volunteers){sections.push(`### ${escapedName(v.name)}`,'',...nonemptyTasks(v.tasks),'')}}else sections.push('_No volunteers added._','');sections.push('## General Notes','',clean(r.notes)||'_No notes._','','## Suggestions','',clean(r.suggestions)||'_No suggestions._','');return sections.join('\n')}
function nonemptyTasks(tasks){const active=(tasks||[]).map(s=>String(s).trim()).filter(Boolean);return active.length?active.flatMap(t=>[...t.split('\n').map((line,i)=>(i? '  '+line:'- '+line))]):['_No tasks recorded._']}
// Compact, dependency-free Markdown preview, safely escaping source HTML.

function applyFormat(kind){const ta=$('#note-body'),n=activeNote();if(!ta||!n)return;const start=ta.selectionStart,end=ta.selectionEnd,selected=ta.value.slice(start,end);const parts={bold:['**','**','bold text'],italic:['*','*','italic text'],heading:['## ','','Heading'],list:['- ','','List item'],quote:['> ','','Quote']};const [before,after,placeholder]=parts[kind];let value,selectionStart,selectionEnd;if(['heading','list','quote'].includes(kind)){const lineStart=ta.value.lastIndexOf('\n',start-1)+1;value=ta.value.slice(0,lineStart)+before+ta.value.slice(lineStart);selectionStart=start+before.length;selectionEnd=end+before.length}else{const mid=selected||placeholder;value=ta.value.slice(0,start)+before+mid+after+ta.value.slice(end);selectionStart=start+before.length;selectionEnd=selectionStart+mid.length}ta.value=value;ta.focus();ta.setSelectionRange(selectionStart,selectionEnd);n.body=value;touch(n);$('#word-count').textContent=`${countWords(value)} words`}

function action(name,b){const n=activeNote(),r=activeReport();switch(name){case'new-note':newNote();break;case'back-notes':view.noteId=null;view.preview=false;render();break;case'note-edit':view.preview=false;render();$('#note-body')?.focus();break;case'note-preview':view.preview=true;render();break;case'copy-note':if(n)copyText(n.body);break;case'export-note':if(n)download(safeFilename(n.title)+'.md',n.body);break;case'export-note-docx':if(n)downloadDocx(safeFilename(n.title)+'.docx',n.body,n.title||'Untitled');break;case'delete-note':if(n&&confirm(`Delete “${n.title||'Untitled'}”? This cannot be undone.`)){data.notes=data.notes.filter(x=>x.id!==n.id);view.noteId=null;save();render()}break;

// Simple event delegation lets text fields remain focused while autosaving.

document.addEventListener('change',async e=>{const t=e.target,r=activeReport();if(t.id==='report-status'&&r){r.status=t.value;touch(r)}if(t.id==='report-month'&&r){const duplicate=data.reports.find(x=>x.id!==r.id&&x.month===t.value);if(duplicate){notify('A report for that month already exists');t.value=r.month;return}if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(t.value||'')){t.value=r.month;return}r.month=t.value;touch(r);render()}
if(t.id==='restore-input'){const file=t.files?.[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!parsed||!Array.isArray(parsed.notes)||!Array.isArray(parsed.reports)||!parsed.settings||!parsed.version)throw Error('Invalid file');if(!confirm('Restore this backup? It replaces ALL current notes and reports.'))return;const previous=data;data=parsed;if(!save()){data=previous;return}setTab('notes');notify('Backup restored')}catch{notify('Invalid backup file')}finally{t.value=''}}});
// Back: inner pages/settings/reports -> Notes; at Notes root press twice to exit.
// In native Capacitor, use the Android App plugin; PWA/browser has no reliable exit API.
let lastExitBack=0;
const CAP_APP=globalThis.Capacitor?.Plugins?.App;
const NATIVE_BACK=!!(globalThis.Capacitor?.isNativePlatform?.() && CAP_APP?.addListener);
function handleBack(native=false){

 const t=Date.now();if(t-lastExitBack<2000){lastExitBack=0;
  if(native&&CAP_APP?.exitApp){CAP_APP.exitApp().catch(err=>console.error('Exit failed',err));return true}

function onBrowserBack(){const exit=handleBack(false);if(!exit)history.pushState({voidGuard:true},'')}
