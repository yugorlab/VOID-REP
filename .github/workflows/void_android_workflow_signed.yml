name: Android APK
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK type'
        required: true
        default: release
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate native Android project
        run: npx cap add android
      - name: Synchronize assets and plugins
        run: npx cap sync android

      - name: Python for Android icon generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply VOID launcher icon
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Image.open('www/icon-512.png').convert('RGBA')
          res = Path('android/app/src/main/res')

          # Legacy launcher icons, including the circular variant.
          for density, size in {
              'mdpi': 48, 'hdpi': 72, 'xhdpi': 96,
              'xxhdpi': 144, 'xxxhdpi': 192
          }.items():
              folder = res / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              icon = src.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / 'ic_launcher.png')
              icon.save(folder / 'ic_launcher_round.png')

          # Adaptive icon: keep only the purple design on transparent foreground.
          foreground = src.copy()
          foreground.putdata([
              (r, g, b, 0 if max(r, g, b) < 12 else a)
              for r, g, b, a in foreground.getdata()
          ])
          for density, size in {
              'mdpi': 108, 'hdpi': 162, 'xhdpi': 216,
              'xxhdpi': 324, 'xxxhdpi': 432
          }.items():
              folder = res / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              canvas = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              side = round(size * 0.90)
              art = foreground.resize((side, side), Image.Resampling.LANCZOS)
              canvas.alpha_composite(art, ((size-side)//2, (size-side)//2))
              canvas.save(folder / 'ic_launcher_foreground.png')

          background = res / 'drawable' / 'void_launcher_background.xml'
          background.parent.mkdir(parents=True, exist_ok=True)
          background.write_text(
              '<shape xmlns:android="http://schemas.android.com/apk/res/android">'
              '<solid android:color="#000000"/></shape>', encoding='utf-8'
          )
          adaptive = (
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">'
              '<background android:drawable="@drawable/void_launcher_background"/>'
              '<foreground android:drawable="@mipmap/ic_launcher_foreground"/>'
              '</adaptive-icon>'
          )
          anydpi = res / 'mipmap-anydpi-v26'
          anydpi.mkdir(parents=True, exist_ok=True)
          for name in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              (anydpi / name).write_text(adaptive, encoding='utf-8')

          print('VOID launcher icons generated for all Android densities')
          PY

      - name: Restore signing key and configure release
        if: ${{ inputs.build_type == 'release' }}
        shell: bash
        env:
          VOID_KEYSTORE_BASE64: ${{ secrets.VOID_KEYSTORE_BASE64 }}
          VOID_KEYSTORE_PASSWORD: ${{ secrets.VOID_KEYSTORE_PASSWORD }}
          VOID_KEY_ALIAS: ${{ secrets.VOID_KEY_ALIAS }}
          VOID_KEY_PASSWORD: ${{ secrets.VOID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in VOID_KEYSTORE_BASE64 VOID_KEYSTORE_PASSWORD VOID_KEY_ALIAS VOID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done
          printf '%s' "$VOID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/void-release.jks"
          chmod 600 "$RUNNER_TEMP/void-release.jks"
          cat >> android/app/build.gradle <<'GRADLE'

          // Generated temporarily in GitHub Actions; signing credentials are environment variables.
          android {
              signingConfigs {
                  voidRelease {
                      storeFile file(System.getenv('VOID_KEYSTORE_FILE'))
                      storePassword System.getenv('VOID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('VOID_KEY_ALIAS')
                      keyPassword System.getenv('VOID_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.voidRelease
                  }
              }
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv('VOID_VERSION_CODE'))
                  versionName '0.3.1'
              }
          }
          GRADLE

      - name: Build debug APK
        if: ${{ inputs.build_type == 'debug' }}
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Build signed release APK
        if: ${{ inputs.build_type == 'release' }}
        env:
          VOID_KEYSTORE_FILE: ${{ runner.temp }}/void-release.jks
          VOID_KEYSTORE_PASSWORD: ${{ secrets.VOID_KEYSTORE_PASSWORD }}
          VOID_KEY_ALIAS: ${{ secrets.VOID_KEY_ALIAS }}
          VOID_KEY_PASSWORD: ${{ secrets.VOID_KEY_PASSWORD }}
          VOID_VERSION_CODE: ${{ github.run_number }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOID-Android-${{ inputs.build_type }}
          path: android/app/build/outputs/apk/${{ inputs.build_type }}/app-${{ inputs.build_type }}.apk
          if-no-files-found: error
